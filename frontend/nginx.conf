server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /app/settings) aren't real files
    # on disk — fall back to index.html so the SPA's router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
