services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roisystem
      POSTGRES_PASSWORD: roisystem
      POSTGRES_DB: roisystem
    ports:
      - "5434:5432"
    volumes:
      - roisystem_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - roisystem_redis_data:/data

volumes:
  roisystem_postgres_data:
  roisystem_redis_data:
